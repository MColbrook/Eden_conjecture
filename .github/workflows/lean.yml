name: Lean
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Eden Solution PalomarSolution
          use-mathlib-cache: true
      - name: Check theorem axioms
        run: python3 checks/check_axioms.py
      - name: Compile statement specification
        run: lake build Challenge PalomarChallenge
