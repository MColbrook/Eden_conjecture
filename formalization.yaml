  notes: >-
    The paper's AI declaration (page 9) reports discussions with ChatGPT 6,
    use of Codex first to attempt a proof of the conjecture and subsequently
    to obtain the counterexample, and ChatGPT 6 assistance with the Lean
    verification. Matthew J. Colbrook checked the proof and problem formulation
    against the paper and reviewed and adopted its contents. Codex also prepared
    the independent Palomar statement, proof wrapper, metadata and preflight
    workflow. Costs and complete prompting records are not reconstructed.
fidelity:
  divergences: >-
    Squared radii and explicit radial solutions provide intermediate formulas.
    The derivative and singular values use the ambient Euclidean inner product.
    Fin 5 indices are numbered from zero. The Palomar theorem existentially
    quantifies the flow and proves its initial condition, ODE, forward uniqueness
    and semigroup law. Local dimensions are defined by suprema with attainment
    proved, and singular-value exponents by limits with convergence proved.
    Historical assertions and cited external results are outside the formal
    statements. The result concerns the unrestricted conjecture, not restrictions
    to transitive, strange or typical attractors. See PALOMAR.md for the exact
    statement-to-paper correspondence and published source identification.
