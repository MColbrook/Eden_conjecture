version: "v0.4"
project:
  name: "A counterexample to the unrestricted form of Eden's conjecture"
  description: >-
    For every c > 4, an explicit polynomial ODE on Euclidean five-space has a
    compact global attractor and uniformly negative divergence. Its finite-time
    local Lyapunov dimension at every positive real time and its asymptotic
    Kaplan--Yorke dimension have maximum 4 + 4/c, attained precisely on an
    invariant two-torus with irrational angular flow. The maximum over equilibria
    and periodic points is 3. All singular-value exponents exist, and local
    dimensions converge pointwise. This disproves the unrestricted form of
    Eden's conjecture; the attractor is not assumed transitive.
  authors: ["Matthew J. Colbrook"]
  responsible_maintainers: ["Matthew J. Colbrook"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.DS"]
  msc2020: ["37C45", "37D25", "34D45"]
